id: contact_labdoo
title: 'Contact Labdoo'
description: '<p>Main contact point at Labdoo platform.</p>'
categories: {  }
elements: |-
  markup:
    '#type': webform_markup
    '#markup': '<p><font size="4" color="#FF2400"><strong style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(51, 51, 51);font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Thank you for reaching out to Project Labdoo.</strong></font><br><font style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" size="3" font="" color="#625D5D">Please fill out the following form and after reviewing your message we will get back to you.</font></p>'
  flexbox:
    '#type': webform_flexbox
    contact_form:
      '#type': container
      name:
        '#type': textfield
        '#title': Name
        '#required': true
      email_address:
        '#type': webform_email_confirm
        '#title': 'Email address'
        '#required': true
        '#confirm__title': 'Confirm email'
      country:
        '#type': webform_address
        '#title': Country
        '#required': true
        '#address__access': false
        '#address_2__access': false
        '#state_province__access': false
        '#postal_code__access': false
        '#country__required': true
        '#select2': true
      the_reason_you_are_contacting_labdoo_org:
        '#type': select
        '#title': 'The reason you are contacting Labdoo.org'
        '#options':
          1: 'I want to contribute a device (laptop, tablet, mobile phone, etc.)'
          2: 'want to contribute a trip (dootrip)'
          3: 'I want to become a Labdoo volunteer (labdooer)'
          4: 'I want to solicit laptops or tablets for my educational project (edoovillage)'
          5: 'I just want to send a message to Labdoo.org'
        '#empty_option': Select
        '#select2': true
        '#required': true
      message:
        '#type': textarea
        '#title': Message
        '#required': true
    description:
      '#type': container
      about:
        '#type': webform_markup
        '#markup': '<p>Labdoo is a global non-profit collaborative platform that repurposes unused laptops by installing educational software and delivering them to schools in need worldwide. This initiative operates without incurring additional economic costs or generating extra CO2 emissions, aligning with its commitment to environmental sustainability. Founded in 2010, Labdoo has expanded its reach to support over 2,600 schools across more than 148 countries, benefiting over 800,000 students.</p><p>The organization functions through a network of volunteers who collect, refurbish, and distribute these laptops, referred to as "Dootronics." Transportation of the devices is achieved via "Dootrips," where travelers carry laptops to their destinations, ensuring delivery without additional environmental impact. These efforts are coordinated through "hubs," groups of volunteers who manage local activities such as device collection, refurbishment, and distribution.</p><p>Labdoo operates on a zero-funding model, relying entirely on volunteer efforts without monetary donations. This approach emphasizes the organization''s dedication to sustainability and community-driven impact. By leveraging existing resources and volunteer networks, Labdoo effectively bridges the digital divide, providing children in underprivileged regions with access to educational tools and opportunities.</p>'
  captcha:
    '#type': captcha
    '#captcha_type': recaptcha_v3/recaptcha_v3_check
