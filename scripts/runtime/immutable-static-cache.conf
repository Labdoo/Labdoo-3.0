# Content-addressed theme assets and fingerprinted Drupal aggregates only.
# Browser copies are immutable; the restricted staging edge remains bounded.
# Preserve explicit private/no-store decisions and never cache error responses.
<LocationMatch "^/(?:themes/custom/labdoo_next/static/(?:vendor/)?[a-f0-9]{64}/[A-Za-z0-9_./-]+|sites/(?:default|labdoo_e2e)/files/(?:css/css_[A-Za-z0-9_-]{43}\.css|js/js_[A-Za-z0-9_-]{43}\.js)(?:\.(?:gz|br))?)$">
    Header onsuccess set Cache-Control "public, max-age=31536000, s-maxage=300, immutable" "expr=%{REQUEST_STATUS} == 200 && %{CONTENT_TYPE} =~ m#^(?:text/(?:css|javascript)|application/(?:javascript|x-javascript)|image/(?:webp|svg\+xml|png|jpeg)|font/woff2)(?:;|$)# && -z resp('Cache-Control') && -z resp('Pragma')"
</LocationMatch>
