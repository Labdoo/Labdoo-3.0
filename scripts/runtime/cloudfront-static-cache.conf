# CloudFront adds this nonsecret marker on its dedicated static origin. Unlike
# LocationMatch, it survives ErrorDocument/Drupal internal redirects. A viewer
# forging it can only prevent caching; it grants no access. Authentication and
# ordinary dynamic requests remain unchanged. Preserve existing private/no-store.
# A root Location runs after per-directory headers and still matches the final
# internal error handler, preventing a directory's public max-age winning later.
<Location "/">
    Header onsuccess unset Cache-Control "expr=req_novary('X-Labdoo-Static-Cache') == '1' && (%{REQUEST_STATUS} >= 300 || %{CONTENT_TYPE} !~ m#^(?:text/(?:css|javascript)|application/(?:javascript|x-javascript|font-woff)|image/(?:webp|svg\+xml|png|jpeg)|font/woff2)(?:;|$)#)"
    Header always set Cache-Control "private, no-store, max-age=0" "expr=req_novary('X-Labdoo-Static-Cache') == '1' && (%{REQUEST_STATUS} >= 300 || %{CONTENT_TYPE} !~ m#^(?:text/(?:css|javascript)|application/(?:javascript|x-javascript|font-woff)|image/(?:webp|svg\+xml|png|jpeg)|font/woff2)(?:;|$)#)"
</Location>
