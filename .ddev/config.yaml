name: labdoo3
type: drupal11
docroot: web
php_version: "8.3"
webserver_type: nginx-fpm
database:
  type: mysql
  version: "8.0"
composer_version: "2"
ddev_version_constraint: ">= v1.25.5"
xdebug_enabled: false
use_dns_when_possible: true
bind_all_interfaces: false
# Keep the tracked settings.php and existing host credentials untouched.
# Create the ignored settings.local.php as documented in the developer guide.
disable_settings_management: true
web_environment: []
