services:
  labdoo_edoovillage.export.csv:
    class: Drupal\labdoo_edoovillage\Service\Export\CsvExport
    arguments: ['@labdoo_common.repository.view']
  labdoo_edoovillage.permission.dootronic:
    class: Drupal\labdoo_edoovillage\Service\Permission\DootronicPermissionChecker
  labdoo_edoovillage.sequence_manager:
    class: Drupal\labdoo_edoovillage\Service\SequenceManager
    arguments: ['@lock.persistent', '@database']
  labdoo_edoovillage.repository:
    class: Drupal\labdoo_edoovillage\Service\Repository\EdooVillageRepository
    arguments: ['@labdoo_edoovillage.sequence_manager', '@database', '@event_dispatcher']
  labdoo_edoovillage.recompute_feeder:
    class: Drupal\labdoo_edoovillage\Service\Queue\Feeder\EdooVillageRecomputeQueueFeeder
    arguments: ['@queue']
  labdoo_edoovillage.compute:
    class: Drupal\labdoo_edoovillage\Service\Compute\EdooVillageCompute
    arguments: ['@labdoo_edoovillage.recompute_feeder']
