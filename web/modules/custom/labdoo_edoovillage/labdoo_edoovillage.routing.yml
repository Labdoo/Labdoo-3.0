labdoo_edoovillage.export_csv:
  path: '/edoovillage/export/csv/{viewId}/{displayId}'
  defaults:
    _controller: '\Drupal\labdoo_edoovillage\Controller\ExportController::exportCSV'
    _title: 'CSV data export'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      viewId:
        type: string
      displayId:
        type: string
