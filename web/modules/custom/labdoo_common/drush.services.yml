services:
  labdoo_common.commands:
    class: \Drupal\labdoo_common\Commands\GeocodeCommands
    arguments: ['@entity_type.manager', '@entity_field.manager', '@labdoo_common.geocode_cache_manager']
    tags:
      - { name: drush.command }
  labdoo_common.statistics_commands:
    class: \Drupal\labdoo_common\Commands\StatisticsCommands
    arguments: ['@entity_type.manager', '@labdoo_migrate.database.external_connection_manager']
    tags:
      - { name: drush.command }
  labdoo_common.cleanup_commands:
    class: \Drupal\labdoo_common\Commands\CleanupCommands
    arguments: ['@entity_type.manager']
    tags:
      - { name: drush.command }
