services:
  labdoo_migrate.synchronizer_commands:
    class: \Drupal\labdoo_migrate\Commands\SynchronizerCommands
    arguments:
      - '@labdoo_migrate.config.configuration_manager'
      - '@labdoo_migrate.mapper.fields_mapper'
      - '@labdoo_migrate.tracking.migration_tracker'
      - '@queue_manager.helper'
    tags:
      - { name: drush.command }

  labdoo_migrate.node_delete_commands:
    class: \Drupal\labdoo_migrate\Commands\NodeDeleteCommands
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: drush.command }

  labdoo_migrate.synchronizer_story_commands:
    class: \Drupal\labdoo_migrate\Commands\StorySynchronizerCommands
    arguments:
      - '@labdoo_migrate.database.external_connection_manager'
      - '@labdoo_migrate.media.file_manager'
      - '@entity_type.manager'
      - '@labdoo_migrate.tracking.migration_tracker'
    tags:
      - { name: drush.command }

  labdoo_migrate.synchronizer_team_commands:
    class: \Drupal\labdoo_migrate\Commands\TeamSynchronizerCommands
    arguments:
      - '@labdoo_migrate.database.external_connection_manager'
      - '@labdoo_migrate.media.file_manager'
      - '@entity_type.manager'
      - '@labdoo_migrate.media.media_manager'
      - '@labdoo_migrate.tracking.migration_tracker'
      - '@database'
      - '@labdoo_migrate.destination_content.repository.comment'
    tags:
      - { name: drush.command }

  labdoo_migrate.synchronizer_gallery_commands:
    class: \Drupal\labdoo_migrate\Commands\GallerySynchronizerCommands
    arguments:
      - '@labdoo_migrate.database.external_connection_manager'
      - '@labdoo_migrate.media.file_manager'
      - '@entity_type.manager'
      - '@database'
    tags:
      - { name: drush.command }

  labdoo_migrate.import_permissions:
    class: Drupal\labdoo_migrate\Commands\ImportPermissionsCommands
    arguments:
      - '@user.permissions'
    tags:
      - { name: drush.command }

  labdoo_migrate.synchronizer_basic_page_commands:
    class: \Drupal\labdoo_migrate\Commands\BasicPageSynchronizerCommands
    arguments:
      - '@labdoo_migrate.database.external_connection_manager'
      - '@labdoo_migrate.media.file_manager'
      - '@entity_type.manager'
      - '@labdoo_migrate.source_content.translation_repository'
      - '@labdoo_migrate.destination_content.translation_repository'
      - '@language_manager'
    tags:
      - { name: drush.command }

  labdoo_migrate.cleanup_commands:
    class: \Drupal\labdoo_migrate\Commands\CleanupCommands
    arguments:
      - '@database'
      - '@labdoo_migrate.database.external_connection_manager'
    tags:
      - { name: drush.command }

  labdoo_migrate.integrity_check_commands:
    class: \Drupal\labdoo_migrate\Commands\IntegrityCheckCommands
    arguments:
      - '@labdoo_migrate.config.configuration_manager'
      - '@labdoo_migrate.mapper.fields_mapper'
      - '@labdoo_migrate.source_content.repository.node'
      - '@entity_type.manager'
      - '@labdoo_migrate.tracking.migration_tracker'
      - '@labdoo_migrate.database.external_connection_manager'
      - '@language_manager'
    tags:
      - { name: drush.command }

  labdoo_migrate.purge_commands:
    class: \Drupal\labdoo_migrate\Commands\PurgeCommands
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@cache_tags.invalidator'
    tags:
      - { name: drush.command }
