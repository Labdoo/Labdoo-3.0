services:
  labdoo_hub.export.csv:
    class: Drupal\labdoo_hub\Service\Export\CsvExport
    arguments: ['@labdoo_common.repository.view']
  labdoo_hub.repository:
    class: Drupal\labdoo_hub\Service\Repository\HubRepository
    arguments: ['@database', '@event_dispatcher']
  labdoo_hub.recompute_feeder:
    class: Drupal\labdoo_hub\Service\Queue\Feeder\HubRecomputeQueueFeeder
    arguments: ['@queue_manager.helper']
  labdoo_hub.compute:
    class: Drupal\labdoo_hub\Service\Compute\HubCompute
    arguments: ['@labdoo_hub.recompute_feeder']
