labdoo_scraper.form:
  path: '/admin/config/services/labdoo-scraper'
  defaults:
    _form: '\Drupal\labdoo_scraper\Form\ScraperForm'
    _title: 'Labdoo Scraper'
  requirements:
    _permission: 'administer site configuration'

labdoo_scraper.report:
  path: '/admin/reports/labdoo-scraper'
  defaults:
    _controller: '\Drupal\labdoo_scraper\Controller\ScraperReportController::report'
    _title: 'Labdoo Scraper Report'
  requirements:
    _permission: 'access site reports'
