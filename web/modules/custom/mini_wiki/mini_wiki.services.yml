services:
  mini_wiki.tree_manager:
    class: Drupal\mini_wiki\Service\MiniWikiTreeManager
    arguments:
      - '@entity_type.manager'
      - '@language_manager'

  mini_wiki.repository:
    class: Drupal\mini_wiki\Service\MiniWikiRepository
    arguments:
      - '@entity_type.manager'

  mini_wiki.route_subscriber:
    class: Drupal\mini_wiki\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
