labdoo_quotes.random:
  path: '/labdoo/education-quote/{langcode}'
  defaults:
    _controller: '\Drupal\labdoo_quotes\Controller\QuoteController::random'
    _format: 'json'
  requirements:
    # Public landing page; it displays no private account information.
    _access: 'TRUE'
    langcode: '[a-z][a-z0-9-]*'
  methods: [GET]
  options:
    no_cache: TRUE
