labdoo_wiki.user_broken_links:
  path: '/user/{user}/broken-links'
  defaults:
    _controller: '\Drupal\labdoo_wiki\Controller\UserBrokenLinksController::brokenLinks'
    _title: 'My Wiki Pages - Broken Links'
  requirements:
    _custom_access: '\Drupal\labdoo_wiki\Controller\UserBrokenLinksController::access'
    user: \d+
  options:
    parameters:
      user:
        type: entity:user
