labdoo_map.map_points:
  path: '/api/map-points/{type}'
  defaults:
    _controller: '\Drupal\labdoo_map\Controller\MapDataController::getMapPoints'
  requirements:
    _permission: 'access content'

labdoo_map.node_trajectory:
  path: '/api/node-trajectory/{nid}'
  defaults:
    _controller: '\Drupal\labdoo_map\Controller\MapDataController::getNodeTrajectory'
  requirements:
    _permission: 'access content'

labdoo_map.suspicious_locations:
  path: '/admin/reports/suspicious-locations'
  defaults:
    _controller: '\Drupal\labdoo_map\Controller\SuspiciousLocationsController::report'
    _title: 'Suspicious Locations Report'
  requirements:
    _permission: 'access suspicious locations report'
