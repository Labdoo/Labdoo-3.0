design:
  css:
    theme:
      css/labdoo-next.css: { weight: 100 }
  js:
    js/labdoo-next.js: {}
  dependencies:
    - labdoo_next/early
    - labdoo/custom-styling
    - core/drupal
    - core/drupalSettings
    - core/once

map:
  js:
    js/lazy-maps.js: {}
  css:
    theme:
      vendor/leaflet-1.0.3/dist/leaflet.css: {}
      vendor/markercluster-1.5.3/dist/MarkerCluster.css: {}
      vendor/markercluster-1.5.3/dist/MarkerCluster.Default.css: {}
      /themes/custom/labdoo/css/labdoo-map.css: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once
    - core/drupalSettings
    - geolocation/geolocation.map

lazy_chartjs:
  js:
    js/lazy-charts.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - charts/global

early:
  header: true
  js:
    js/early.js: {}

# Separate the CSS asset cache for anonymous public pages and editorial pages.
public:
  dependencies:
    - labdoo_next/design

analytics_consent:
  js:
    js/analytics-consent.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/jquery
    - core/drupalSettings
    - eu_cookie_compliance/eu_cookie_compliance
